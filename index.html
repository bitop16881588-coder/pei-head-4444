<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>頭腦備份站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.7.0/style.css">
<style>
  /* 可愛圓體（jf-openhuninn），載入失敗會自動退回 Noto Sans TC */
  @font-face{
    font-family:"jf-openhuninn";
    src:url("https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.0.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --paper:#fff4ef;
    --card:#ffffff;
    --ink:#5b4a44;
    --ink-soft:#b09a92;
    --line:#ffe5dc;
    --accent:#ff8c7a;
    --accent-2:#7ecbc0;
    --accent-soft:#ffe7e1;
    --danger:#ef6b6b;
    --bg1:#ffe1d6;
    --bg2:#d8f3ee;
    --shadow:0 2px 4px rgba(214,150,135,.10),0 10px 22px rgba(214,150,135,.14);
    --radius:20px;
    --round:"Noto Sans TC","Noto Sans SC",system-ui,sans-serif;
  }
  body.theme-mint{--paper:#f1fbf8;--line:#d4efe7;--accent:#3fb89a;--accent-soft:#d6f1ea;--accent-2:#7ecbc0;--ink:#3f5048;--ink-soft:#94b3a8;--bg1:#d8f3ec;--bg2:#e6f1d9;}
  body.theme-milktea{--paper:#faf4ec;--line:#ecdcc7;--accent:#c2925f;--accent-soft:#f1e6d6;--accent-2:#cbb08c;--ink:#574a3c;--ink-soft:#b8a791;--bg1:#f1e1cf;--bg2:#efe7d6;}
  body.theme-sky{--paper:#f1f7fd;--line:#d6e6f4;--accent:#5b9bd8;--accent-soft:#dcebf8;--accent-2:#7fb3df;--ink:#3f4a58;--ink-soft:#98a8bd;--bg1:#d6e8fb;--bg2:#def0f5;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","Noto Sans SC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(circle at 12% -5%, var(--bg1) 0, transparent 42%),
      radial-gradient(circle at 92% 4%, var(--bg2) 0, transparent 38%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    transition:background .4s;
  }
  .wrap{max-width:none;margin:0 auto;padding:20px 22px 80px}

  /* header */
  header.app{display:flex;align-items:center;gap:13px;margin-bottom:22px}
  .mark{
    width:48px;height:48px;border-radius:16px;flex:0 0 auto;
    background:linear-gradient(140deg,#ffb3a0,#ff8c7a);
    box-shadow:0 6px 14px rgba(255,140,122,.4),inset 0 -3px 6px rgba(0,0,0,.06);
    display:grid;place-items:center;font-size:25px;line-height:1;
    transform-origin:50% 60%;animation:bob 3.4s ease-in-out infinite;
  }
  .mark svg{width:34px;height:34px;display:block}
  .mark .eye{transform-box:fill-box;transform-origin:center}
  .mark.blink .eye{animation:blink .42s ease}
  @keyframes blink{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.12)}}
  @keyframes bob{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-3px)}}
  .title-block h1{
    font-family:var(--round);font-size:24px;margin:0;font-weight:700;letter-spacing:1px;color:#ff7a66;
  }
  .title-block p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);font-family:var(--round)}
  .spacer{flex:1}
  .ghost-btn{
    border:2px solid var(--line);background:var(--card);color:var(--ink-soft);
    font:inherit;font-size:13px;padding:7px 13px;border-radius:14px;cursor:pointer;font-weight:500;
    transition:.14s;
  }
  .ghost-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}

  /* 便條紙「今日头条」 */
  .memo-note{
    --m-bg1:#fff6c9;--m-bg2:#ffe9a8;--m-line:rgba(214,150,135,.10);--m-border:#f4d98a;--m-title:#a6701f;--m-text:#6b5326;--m-ph:#c2a25f;
    position:relative;margin:0 0 16px;padding:13px 16px 12px;max-width:460px;
    background:
      repeating-linear-gradient(180deg, transparent 0 28px, var(--m-line) 28px 29px),
      linear-gradient(160deg,var(--m-bg1),var(--m-bg2));
    border:1px solid var(--m-border);border-radius:4px 16px 16px 4px;
    box-shadow:0 10px 24px rgba(120,100,60,.22), inset 0 1px 0 rgba(255,255,255,.6);
    transform:rotate(-.6deg);transform-origin:left center;
    animation:memoIn .85s cubic-bezier(.18,.9,.25,1.15) both;
  }
  .memo-note.c-pink{--m-bg1:#ffe2ec;--m-bg2:#ffc9d9;--m-line:rgba(193,77,110,.12);--m-border:#f3b6c8;--m-title:#c14d6e;--m-text:#8a3a52;--m-ph:#d98aa0}
  .memo-note.c-blue{--m-bg1:#dcecff;--m-bg2:#bcdcff;--m-line:rgba(47,111,176,.12);--m-border:#a9cdee;--m-title:#2f6fb0;--m-text:#2f5a8a;--m-ph:#7ba6d4}
  .memo-note.c-green{--m-bg1:#dcf3e4;--m-bg2:#bce6cc;--m-line:rgba(47,138,82,.12);--m-border:#a9ddbb;--m-title:#2f8a52;--m-text:#2f6b46;--m-ph:#7fc39a}
  @keyframes memoIn{
    0%{opacity:0;transform:translateX(-120%) rotate(-8deg) scale(.96)}
    60%{opacity:1;transform:translateX(14px) rotate(1.5deg) scale(1.01)}
    100%{opacity:1;transform:translateX(0) rotate(-.6deg) scale(1)}
  }
  .memo-tape{
    position:absolute;top:-9px;left:42px;transform:rotate(-3deg);
    width:78px;height:20px;background:rgba(255,255,255,.55);
    border:1px solid rgba(180,150,90,.25);border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.08);
  }
  .memo-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;cursor:move;touch-action:none}
  .memo-head button,.memo-head .mc-dot{cursor:pointer}
  .memo-pin{font-size:16px;cursor:grab}
  .memo-title{font-family:var(--round);font-weight:700;font-size:17px;color:var(--m-title);letter-spacing:1px}
  .memo-date{font-size:12px;color:var(--m-title);opacity:.75;font-weight:600}
  .memo-flex{flex:1}
  .memo-colors{display:flex;gap:4px;margin-right:2px}
  .mc-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .mc-dot.c-yellow{background:#ffd95e}
  .mc-dot.c-pink{background:#ff9db8}
  .mc-dot.c-blue{background:#8fbef0}
  .mc-dot.c-green{background:#86d6a4}
  .mc-dot.sel{outline:2px solid rgba(90,74,68,.4);outline-offset:1px}
  .memo-hide{
    border:none;background:rgba(90,74,68,.12);color:var(--m-title);font:inherit;font-weight:700;
    width:22px;height:22px;border-radius:7px;cursor:pointer;line-height:1;
  }
  .memo-hide:hover{background:rgba(90,74,68,.22)}
  .memo-clear{
    border:none;background:rgba(90,74,68,.12);color:var(--m-title);font:inherit;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:7px;cursor:pointer;line-height:1.4;
  }
  .memo-clear:hover{background:rgba(90,74,68,.22)}
  .memo-clear.armed{background:#ef6b6b;color:#fff}
  #memoBody{
    width:100%;min-height:52px;border:none;outline:none;resize:vertical;background:transparent;
    font-family:"LXGW WenKai TC","jf-openhuninn","Noto Sans TC","Noto Sans SC",sans-serif;
    font-size:17px;line-height:31px;color:var(--m-text);padding:0;letter-spacing:.5px;
  }
  #memoBody::placeholder{color:var(--m-ph);font-family:"LXGW WenKai TC","jf-openhuninn","Noto Sans TC",sans-serif}
  .memo-title,.memo-show{font-family:"jf-openhuninn","Noto Sans TC",sans-serif}
  .memo-show{
    display:block;margin:0 0 16px;border:1.5px dashed #e6bd5e;background:#fff8de;color:#a6701f;
    font:inherit;font-weight:700;border-radius:12px;padding:8px 14px;cursor:pointer;
  }
  .memo-show:hover{background:#fff1c2}

  /* bookmark bar of topics */
  .bookmark-bar{
    display:flex;flex-wrap:wrap;gap:7px;
    background:var(--card);border:2px solid var(--line);border-radius:22px;
    padding:11px;box-shadow:var(--shadow);
  }
  .bm{
    position:relative;display:flex;align-items:center;gap:9px;
    padding:8px 14px 8px 9px;border-radius:15px;cursor:pointer;
    background:transparent;border:none;font:inherit;color:var(--ink);text-align:left;
    max-width:200px;transition:transform .14s,background .14s;
  }
  .bm:hover{background:var(--accent-soft);transform:translateY(-2px) scale(1.03)}
  .bm:active{transform:scale(.96)}
  .bm{touch-action:none}
  .bm.dragging{opacity:.65;transform:scale(1.06);box-shadow:0 8px 20px rgba(120,90,70,.28);z-index:20;cursor:grabbing}
  .bm.sel{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(120,90,70,.22)}
  .bm.sel .lbl{color:#fff}
  .bm.sel .ic{background:rgba(255,255,255,.85)}
  .bm.sel::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--accent)}
  .bm .ic{
    width:30px;height:30px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
    font-size:17px;line-height:1;background:var(--tag,#ffe0d8);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.04);
  }
  .bm .lbl{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bm .badge{
    flex:0 0 auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--accent);color:#fff;font-size:11px;font-weight:700;
    display:grid;place-items:center;box-shadow:0 2px 5px rgba(255,140,122,.45);
  }
  .bm-add{
    display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:15px;cursor:pointer;
    background:transparent;border:2px dashed #ffc9bb;color:var(--accent);
    font:inherit;font-size:14px;font-weight:500;transition:.14s;
  }
  .bm-add:hover{background:var(--accent-soft);transform:translateY(-2px)}
  .bm-add .plus{font-size:18px;line-height:1}

  .empty{
    text-align:center;color:var(--ink-soft);padding:44px 20px;border:2px dashed var(--line);
    border-radius:var(--radius);background:rgba(255,255,255,.5)
  }
  .empty .face{font-size:38px;display:block;margin-bottom:8px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
  .empty strong{display:block;color:var(--accent);font-size:16px;margin-bottom:4px;font-family:var(--round)}

  /* skeleton 載入動畫 */
  .sk-wrap{padding:6px}
  .sk-row{display:flex;gap:10px;margin-bottom:10px}
  .sk-cell{flex:1;height:18px;border-radius:7px;
    background:linear-gradient(90deg,#efe6dd 25%,#f8f1ea 37%,#efe6dd 63%);
    background-size:400% 100%;animation:shimmer 1.3s ease infinite}
  .sk-cell.w-s{flex:.5}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* inline content panel */
  .panel{margin-top:18px;animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .panel-head{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
  .panel-head h2{margin:0;font-size:20px;font-weight:700;font-family:var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bigdot{width:36px;height:36px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;line-height:1;box-shadow:inset 0 -2px 4px rgba(0,0,0,.04)}

  .item{
    background:var(--card);border:2px solid var(--line);border-radius:18px;
    padding:14px 15px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;
    box-shadow:var(--shadow);transition:transform .12s;
  }
  .item:hover{transform:translateY(-1px)}
  .check{
    width:24px;height:24px;border-radius:9px;border:2.5px solid #ffcdc0;flex:0 0 auto;margin-top:1px;
    cursor:pointer;display:grid;place-items:center;background:#fff;transition:.15s;
  }
  .check.on{background:var(--accent);border-color:var(--accent);animation:pop .28s ease}
  @keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;transition:.12s}
  .check.on svg{opacity:1}
  .item-body{flex:1;min-width:0}
  .item-title{font-weight:500;font-size:15.5px;word-break:break-word}
  .item.done .item-title{color:var(--ink-soft);text-decoration:line-through}
  .item-note{font-size:13px;color:var(--ink-soft);margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .item-actions{display:flex;gap:4px;flex:0 0 auto}
  .icon-btn{
    border:none;background:transparent;cursor:pointer;color:#cdb8b0;font-size:13px;
    padding:6px 9px;border-radius:11px;font-family:inherit;font-weight:500;transition:.12s;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
  .icon-btn.del:hover{background:#ffe2e2;color:var(--danger)}
  .icon-btn.confirm{background:var(--danger);color:#fff}
  .icon-btn.confirm:hover{background:#dc5757;color:#fff}

  .add-item-bar{
    display:flex;gap:9px;margin-top:6px;background:var(--card);border:2px solid var(--line);
    border-radius:18px;padding:9px;box-shadow:var(--shadow);align-items:center;
  }
  .attach-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:13px;border:2px solid var(--line);
    background:#fff;cursor:pointer;font-size:18px;line-height:1;transition:.14s;
  }
  .attach-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .add-item-bar input{
    flex:1;border:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);
    padding:6px 9px;outline:none;min-width:0;
  }

  /* file item bits */
  .fic{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
    font-size:19px;line-height:1;background:var(--accent-soft);overflow:hidden;
  }
  .fic img{width:100%;height:100%;object-fit:cover}
  .item-size{font-size:12.5px;color:var(--ink-soft);margin-top:2px}

  /* linked google sheet */
  .sheet-block{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:14px 15px;margin-bottom:12px;
    box-shadow:0 2px 6px rgba(150,110,90,.06),0 14px 34px rgba(150,110,90,.10);
  }
  .sheet-bar{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .sheet-title{font-weight:700;font-size:14.5px;font-family:var(--round);color:var(--accent)}
  .sheet-meta{font-size:12px;color:var(--ink-soft);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-btn{
    border:2px solid var(--line);background:#fff;color:var(--accent);font:inherit;font-size:12.5px;font-weight:500;
    padding:5px 11px;border-radius:11px;cursor:pointer;flex:0 0 auto;transition:.12s;
  }
  .mini-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .mini-btn:disabled{opacity:.6;cursor:default}
  .sheet-search{display:flex;align-items:center;gap:8px;margin:0 0 9px;
    border:2px solid var(--line);border-radius:12px;padding:4px 10px;background:#fff}
  .sheet-search .ss-ic{font-size:14px;opacity:.7}
  .sheet-search input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:6px 2px}
  .sheet-search .ss-clear{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);font-size:13px;padding:4px 6px;border-radius:8px}
  .sheet-search .ss-clear:hover{background:var(--accent-soft);color:var(--accent)}
  .sheet-scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
  table.sheet-tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:17px}
  table.sheet-tbl th,table.sheet-tbl td{
    border-right:1px solid #e7ddcf;border-bottom:1px solid #e7ddcf;padding:11px 14px;text-align:center;white-space:nowrap;
  }
  table.sheet-tbl thead th{background:var(--accent-soft);color:var(--ink);position:sticky;top:0;z-index:3;font-family:var(--round);font-size:16px;font-weight:700;box-shadow:0 2px 0 #e7ddcf}
  table.sheet-tbl thead th.g-in{background:#d9ead3;color:#274e13}
  table.sheet-tbl thead th.g-out{background:#cfe2e6;color:#0c343d}
  table.sheet-tbl tbody td:first-child,table.sheet-tbl thead th:first-child{position:sticky;left:0;z-index:2;background:#fffaf6;box-shadow:1px 0 0 #e7ddcf}
  table.sheet-tbl thead th:first-child{z-index:5}
  table.sheet-tbl tbody tr:nth-child(even){background:#fff8f5}
  td.amt{font-variant-numeric:tabular-nums;font-weight:600}
  /* 加减 美化 */
  .sheet-tbl tbody tr:nth-child(even){background:rgba(255,243,238,.45)}
  .sheet-tbl tbody tr:hover{background:#fff2ec}
  td.amt-cell{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .amt-num{font-weight:700;font-size:15px;color:#4a3f3a;letter-spacing:.3px}
  .amt-num.zero{color:#cdbdb4;font-weight:500}
  td.name-cell{text-align:center;white-space:nowrap}
  td.note-cell{text-align:left;white-space:nowrap}
  .note-txt{font-size:14.5px;color:#5b4a44}
  .ad-chip{display:inline-block;padding:2px 11px;border-radius:999px;font-weight:700;font-size:13px}
  .ad-add{background:#dcefe0;color:#2f8a52}
  .ad-sub{background:#fbe1e1;color:#cf5b5b}
  td.del-c{padding:4px 6px;background:#fffaf6}
  th.del-h{background:var(--accent-soft);width:34px}
  .row-del{border:none;background:transparent;color:#d99;font-size:14px;cursor:pointer;
    width:24px;height:24px;border-radius:8px;line-height:1}
  .row-del:hover{background:#fbe1e1;color:#cf5b5b}
  .note-cell .note-inp{min-width:240px}
  td.note-static{color:#5b4a44}
  td.mc-anno{position:relative;padding-right:22px}
  td.mc-anno .cell-edit{padding-right:20px}
  table.sheet-tbl td[rowspan]{vertical-align:middle;background:#fffdfb;font-weight:600}
  table.sheet-tbl td[rowspan].note-cell{background:#fffdfb}
  .warn-ic{font-size:13px;margin-right:2px}
  td.warn-cell{white-space:nowrap}
  td.warn-cell .warn-ic{vertical-align:middle}
  .notes-add-bar{margin-top:10px}
  .qa-tabs{display:flex;gap:8px;margin:0 2px 10px}
  td.qa-type{width:1%;white-space:nowrap;padding-left:8px;padding-right:8px;text-align:center}
  td.qa-type .cell-sel{min-width:0;width:auto;padding:5px 10px}
  td.qa-type .ad-chip{padding:2px 9px}
  .qa-tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);
    font:inherit;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:.14s}
  .qa-tab:hover{transform:translateY(-1px)}
  .qa-tab.sel{color:#fff;border-color:transparent}
  .qa-tab.sel{background:var(--accent)}
  .qa-tab.out.sel{background:#5a9bd8}
  .qa-tab.inc.sel{background:#3fb87d}
  .qa-tab.spc.sel{background:#8a7fb0}
  .qa-tab.sec-tab.sel{background:#c2925f}
  /* 卡片式 */
  .view-sw{display:flex;gap:6px;margin:0 2px 10px}
  .mini-btn.vw.on{background:var(--accent);color:#fff;border-color:transparent}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;
    box-shadow:0 2px 6px rgba(150,110,90,.06),0 10px 24px rgba(150,110,90,.08);transition:.15s}
  .rcard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(150,110,90,.10),0 16px 32px rgba(150,110,90,.14)}
  .rcard.dim{opacity:.5}
  .rc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}

  .anno-edit{

  }
  @keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}

  .calc-panel{

  }
  .note-show:hover{border-color:var(--accent);color:var(--accent)}
  .calc-act{
    border:none;border-radius:.7em;padding:.6em .2em;font:inherit;font-size:.9em;font-weight:600;cursor:pointer;
    background:#f3ece2;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;transition:.1s;
  }
  .calc-act:hover{background:var(--accent-soft);color:var(--accent)}
  .calc-act:active{transform:scale(.95)}
  .calc-act.ok{background:var(--accent);color:#fff}

  @media(max-width:480px){
    .wrap{padding:16px 8px 70px}

        var after=e.clientX > r.left + r.width/2;
        grid.insertBefore(dragEl, after?over.nextSibling:over);
      }
    }
    function onUp(){
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      if(dragEl && moved){
        dragEl.classList.remove("dragging");
        var ids=Array.prototype.map.call(grid.querySelectorAll(".bm"), function(b){ return b.getAttribute("data-id"); });
        state.topics.sort(function(a,b){ return ids.indexOf(a.id)-ids.indexOf(b.id); });
        save();
        bmDragged=true;   // 抑制這次的 click
      }
      dragEl=null; moved=false;
    }
    grid.addEventListener("pointerdown", function(e){
      if(e.button!=null && e.button!==0) return;
      var el=e.target.closest ? e.target.closest(".bm") : null;
      if(!el || el.parentNode!==grid) return;
      dragEl=el; moved=false; sx=e.clientX; sy=e.clientY;
      document.addEventListener("pointermove", onMove, {passive:false});
      document.addEventListener("pointerup", onUp);
    });
  }

  /* ---------- google auth (OAuth, 私人讀取) ---------- */
  function gReady(){ return (typeof google!=="undefined") && google.accounts && google.accounts.oauth2; }
  function ensureTokenClient(){
    if(gTokenClient) return gTokenClient;
    if(!GOOGLE_CLIENT_ID || !gReady()) return null;
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: function(resp){
        if(resp && resp.access_token){
          gToken = resp.access_token;
          gTokenAt = Date.now();
          try{ localStorage.setItem("gConnected","1"); }catch(e){}
          updateAuthBtn();
          var f = pendingAfterAuth; pendingAfterAuth = null;
          if(f) f();
        }
      }
    });
    return gTokenClient;
  }
  // token 約 1 小時過期；快過期就在背景靜默換新，不跳視窗
  function ensureFreshToken(cb){
    var fresh = gToken && (Date.now()-gTokenAt < 50*60*1000);
    if(fresh){ cb(); return; }
    if(!GOOGLE_CLIENT_ID || !gReady()){ cb(); return; }
    var tc = ensureTokenClient();
    if(!tc){ cb(); return; }
    pendingAfterAuth = cb;
    tc.requestAccessToken({ prompt: "" });   // 靜默續授權
  }
  function gConnect(){
    if(!GOOGLE_CLIENT_ID){ alert("還沒設定 Google 用戶端 ID。\n請先在程式碼最上面的 GOOGLE_CLIENT_ID 填入你的 OAuth 用戶端 ID。"); return; }
    var tc = ensureTokenClient();
    if(!tc){ alert("Google 登入元件還在載入，請稍候一兩秒再試。"); return; }
    tc.requestAccessToken({ prompt: gToken ? "" : "" });
  }
  function gSignOut(){
    if(gToken && gReady()){ try{ google.accounts.oauth2.revoke(gToken, function(){}); }catch(e){} }
    gToken = null; try{ localStorage.removeItem("gConnected"); }catch(e){}
    updateAuthBtn(); renderHome();
  }
  function updateAuthBtn(){
    var b=$("gAuthBtn"); if(!b) return;
    if(gToken){ b.textContent="✓ Google"; b.title="已連結，點此登出"; }
    else { b.textContent="連結 Google"; b.title="登入以讀取私人試算表"; }
  }

  /* ---------- google sheet sync (dispatch) ---------- */
  function parseSheetRef(u){
    var m=(u||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(!m) return null;
    var gid=0, g=(u||"").match(/[#&?]gid=([0-9]+)/);
    if(g) gid=parseInt(g[1],10);
    return { id:m[1], gid:gid };
  }
  function isGoogleSheet(u){ return /\/spreadsheets\/d\//.test(u||"") && !/output=csv/i.test(u||""); }
  function syncSheet(id){
    var t=topicById(id);
    if(!t || !t.sheetUrl) return;
    if(isGoogleSheet(t.sheetUrl)) syncViaApi(id);
    else syncViaCsv(id);
  }
  function handle401(r){
    if(r.status===401) throw new Error("__401__");
    if(!r.ok){ return r.json().then(function(j){ throw new Error((j.error&&j.error.message)||("HTTP "+r.status)); },
                                   function(){ throw new Error("HTTP "+r.status); }); }
    return r.json();
  }
  function friendlyApiErr(e){
    var m=(e&&e.message)||"";
    if(/not been used|disabled|SERVICE_DISABLED|API .* not enabled/i.test(m)) return "請先在 Google Cloud 啟用「Google Sheets API」。";
    if(/PERMISSION_DENIED|permission/i.test(m)) return "這個 Google 帳號沒有這份試算表的存取權。";
    if(/NOT_FOUND|Requested entity/i.test(m)) return "找不到這份試算表，請確認連結正確。";
    return "讀取失敗："+m;
  }
  function syncViaApi(id){
    var t=topicById(id), ref=parseSheetRef(t.sheetUrl);
    if(!ref){ sheetSync[id]={loading:false,error:"連結看不出試算表 ID。"}; if(curTopic===id) renderSheetBlock(t); return; }
    if(!gToken){ sheetSync[id]={loading:false,error:"__NEEDLOGIN__"}; if(curTopic===id) renderSheetBlock(t); return; }
    sheetSync[id]={loading:true,error:""}; if(curTopic===id) renderSheetBlock(t);
    ensureFreshToken(function(){
      var base="https://sheets.googleapis.com/v4/spreadsheets/"+ref.id;
      var hdr={ headers:{ Authorization:"Bearer "+gToken } };
      fetch(base+"?fields=sheets(properties(sheetId,title))", hdr).then(handle401).then(function(meta){
        var sheets=meta.sheets||[];
        var title=null;
        if(t.sheetTab){
          var key=String(t.sheetTab).trim();
          sheets.forEach(function(s){ if(s.properties.title===t.sheetTab) title=s.properties.title; });
          if(!title) sheets.forEach(function(s){ if(String(s.properties.title).trim()===key) title=s.properties.title; });
          if(!title) sheets.forEach(function(s){ if(String(s.properties.title).indexOf(key)>-1) title=s.properties.title; });
        }
        if(!title) sheets.forEach(function(s){ if(s.properties.sheetId===ref.gid) title=s.properties.title; });
        if(!title && sheets[0]) title=sheets[0].properties.title;
        if(!title) throw new Error("NOT_FOUND");
        return fetch(base+"/values/"+encodeURIComponent(title)+"?majorDimension=ROWS", hdr).then(handle401);
      }).then(function(vals){
        t.sheetCache={ rows:(vals.values||[]), at:Date.now() };
        sheetSync[id]={loading:false,error:""};
        if(t.autoFreeze && t.sheetCache.rows.length){   // 抓到就自動永久固定
          t.autoFreeze=false; t.frozenUrl=t.sheetUrl; t.frozenTab=t.sheetTab||"";
          t.sheetUrl=""; t.sheetTab="";
        }
        try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
        if(curTopic===id) renderHome();
      }).catch(function(e){
        if(e && e.message==="__401__"){ pendingAfterAuth=function(){ syncViaApi(id); }; gConnect(); return; }
        sheetSync[id]={loading:false, error:friendlyApiErr(e)};
        if(curTopic===id) renderSheetBlock(t);
      });
    });
  }

  /* ---------- google sheet sync (public CSV / apps script) ---------- */
  function normalizeSheetUrl(u){
    u = (u||"").trim();
    if(!u) return "";
    if(/output=csv/i.test(u)) return u;                 // 已是 CSV（發布到網路）
    var m = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(!m) return u;                                    // 非標準連結，原樣丟給 fetch
    var id = m[1];
    var gid = "";
    var g = u.match(/[#&?]gid=([0-9]+)/);
    if(g) gid = g[1];
    return "https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:csv"+(gid?("&gid="+gid):"");
  }
  function parseCSV(text){
    var rows=[], row=[], cur="", i=0, inQ=false, c;
    while(i<text.length){
      c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=c;
      }else{
        if(c==='"') inQ=true;
        else if(c===','){ row.push(cur); cur=""; }
        else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
        else if(c==='\r'){ /* skip */ }
        else cur+=c;
      }
      i++;
    }
    if(cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){return x!=="";}); });
  }
  // 卡片式（规章）：一列一張卡片，欄位分組
  var CARD_GROUPS=[
    { key:"time",  title:"時間",   icon:"🕐", re:/日切时间|营业|时间(?!超时)/ },
    { key:"rate",  title:"费率",   icon:"💱", re:/费率|手续费|汇率|回U|费用/ },
    { key:"amt",   title:"金额/限额", icon:"💰", re:/金额|限额|放置|上限|日配量|超时|倍数|范围|区间/ },
    { key:"acct",  title:"帐号",   icon:"🔑", re:/BBP商户号|username|用户帐号|群组ID/ },
    { key:"other", title:"其他",   icon:"🔖", re:/多选一|三选一|实际金额参数|验盘|类型|99支付orBB|使用状况|归属/ }
  ];
  var CARD_LONG=/规则|規則|冻结|風控|风控|對接记录|对接记录|创群时间/;
  function statusClass(v){
    if(/已开跑|使用中|正常/.test(v)) return "st-run";
    if(/对接中|對接中|测试|測試/.test(v)) return "st-doing";
    if(/不使用|停用|暂不|暫不|冻结|凍結/.test(v)) return "st-off";
    return "st-none";
  }
  function renderCards(rows, filter){
    if(!rows || !rows.length) return '<div class="sheet-empty">沒有資料</div>';
    var head=rows[0]||[], q=(filter||"").trim().toLowerCase();
    var data=rows.slice(1).filter(function(r){ return r.some(function(c){ return String(c==null?"":c).trim()!==""; }); });
    if(q) data=data.filter(function(r){ return r.some(function(c){ return String(c==null?"":c).toLowerCase().indexOf(q)>-1; }); });
    function findCol(re){ for(var i=0;i<head.length;i++){ if(re.test(String(head[i]||""))) return i; } return -1; }
    var cMerchant=findCol(/商户名|^名称$|^名稱$/), cStatus=findCol(/對接狀況|对接状况|使用状况|使用狀況/),
        cAgent=findCol(/^代理$|归属|歸屬/), cPlane=findCol(/飞机名称|飛機名稱/),
        cRec=findCol(/對接记录|对接记录/), cGroup=findCol(/创群时间/);
    function baseUsed(){ var u={}; [cMerchant,cStatus,cAgent,cPlane].forEach(function(i){ if(i>-1) u[i]=true; }); return u; }
    var h='<div class="card-grid">';
    if(!data.length) h+='<div class="sheet-empty">沒有符合的資料</div>';
    data.forEach(function(r){
      var mer=cMerchant>-1?String(r[cMerchant]||"").trim():"";
      var pln=cPlane>-1?String(r[cPlane]||"").trim():"";
      var title=mer||pln||"（未命名）";
      // 分隔列：只有名称有字，其餘皆空 → 整條分隔標題
      var others=r.filter(function(c,ix){ return ix!==cMerchant && ix!==cAgent && String(c==null?"":c).trim()!==""; });
      if(mer && others.length===0){ h+='<div class="card-divider">'+esc(mer.replace(/[↓↑]+/g,"").trim()||mer)+'</div>'; return; }
      var st=cStatus>-1?String(r[cStatus]||"").trim():"";
      var ag=cAgent>-1?String(r[cAgent]||"").trim():"";
      var used=baseUsed();
      h+='<div class="rcard'+(/不使用|停用|暂不|暫不/.test(st+ag)?" dim":"")+'">';
      h+='<div class="rc-head"><div class="rc-title">'+esc(title)+'</div>'
       + (st?'<span class="rc-st '+statusClass(st)+'">'+esc(st)+'</span>':'')+'</div>';
      if(ag||pln) h+='<div class="rc-sub">'+(ag?'<span class="rc-chip">🏷 '+esc(ag)+'</span>':'')
                   + (pln&&mer?'<span class="rc-chip">✈️ '+esc(pln)+'</span>':'')+'</div>';
      CARD_GROUPS.forEach(function(g){
        var items="";
        for(var i=0;i<head.length;i++){
          var hd=String(head[i]||"").trim(); if(!hd || used[i]) continue;
          if(CARD_LONG.test(hd) || !g.re.test(hd)) continue;
          var v=String(r[i]==null?"":r[i]).trim(); if(!v) continue;
          used[i]=true;
          items+='<div class="rc-kv"><span class="rc-k">'+esc(hd)+'</span><span class="rc-v">'+esc(v)+'</span></div>';
        }
        if(items) h+='<div class="rc-grp"><div class="rc-gt">'+g.icon+' '+g.title+'</div><div class="rc-kvs">'+items+'</div></div>';
      });
      // 長文字欄位（规则/风控/記錄…）整段呈現
      var longs="";
      for(var li=0;li<head.length;li++){
        var lhd=String(head[li]||"").trim(); if(!lhd || used[li]) continue;

    if(navigator.clipboard && navigator.clipboard.writeText){

  function syncViaCsv(id){
    var t=topicById(id);

    sheetSync[id]={loading:true, error:""};
    if(curTopic===id) renderSheetBlock(t);
    var url=normalizeSheetUrl(t.sheetUrl);
    fetch(url, {cache:"no-store"}).then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.text();
    }).then(function(text){
      if(/<html/i.test(text)) throw new Error("page");
      var rows=parseCSV(text);
      t.sheetCache={rows:rows, at:Date.now()};
      sheetSync[id]={loading:false, error:""};
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ /* 表太大就不快取 */ }
      if(curTopic===id) renderSheetBlock(t);
    }).catch(function(){
      sheetSync[id]={loading:false, error:"讀不到內容。請確認試算表已「發布到網路（CSV）」或共用設為『知道連結的任何人可檢視』。"};

  }

  /* ---------- file helpers ---------- */
  function humanSize(b){
    if(b==null) return "";
    if(b<1024) return b+" B";
    if(b<1048576) return (b/1024).toFixed(1)+" KB";
    return (b/1048576).toFixed(1)+" MB";
  }
  function fileIcon(name, mime){
    var ext=(name||"").split(".").pop().toLowerCase();
    if(["xls","xlsx","xlsm","csv"].indexOf(ext)>-1) return "📊";
    if(["doc","docx"].indexOf(ext)>-1) return "📝";
    if(ext==="pdf") return "📕";
    if(["ppt","pptx","key"].indexOf(ext)>-1) return "📑";
    if(["zip","rar","7z"].indexOf(ext)>-1) return "🗜️";
    if(["txt","md","rtf"].indexOf(ext)>-1) return "📄";
    if(["mp3","wav","m4a"].indexOf(ext)>-1) return "🎵";
    if(["mp4","mov","avi"].indexOf(ext)>-1) return "🎬";
    if(mime && mime.indexOf("image/")===0) return "🖼️";
    return "📎";
  }

  function addFiles(fileList){
    var files=Array.prototype.slice.call(fileList||[]);

    (function next(){

      var f=files[i++];
      if(f.size > 4*1024*1024){
        alert("「"+f.name+"」太大了（"+humanSize(f.size)+"）。\n本機儲存建議單檔小於 4MB，這個先略過。");
        next(); return;
      }
      var r=new FileReader();
      r.onload=function(){
        var item={ id:uid(), type:"file", name:f.name, mime:f.type||"", size:f.size, data:r.result, note:"", done:false };
        t.items.push(item);
        try{
          localStorage.setItem(KEY, JSON.stringify(state));

          t.items.pop();

  /* ---------- 小計算機 ---------- */
  var calc = { now:"0", acc:null, op:null, waiting:false, expr:"" };
  function calcRender(){
    var n=$("calcNow"), x=$("calcExpr");
    if(n) n.textContent = calc.now;
    if(x) x.textContent = calc.expr;
  }
  function calcFmt(n){
    if(!isFinite(n)) return "Error";
    return String(Math.round((n+Number.EPSILON)*1e10)/1e10);
  }
  function calcSym(op){ return op==="*"?"×":op==="/"?"÷":op==="-"?"−":"＋"; }
  function calcApply(a,op,b){
    switch(op){ case "+":return a+b; case "-":return a-b; case "*":return a*b; case "/":return b===0?NaN:a/b; }
    return b;
  }
  function calcKey(k){
    if(/^[0-9]$/.test(k)){
      if(calc.waiting){ calc.now=k; calc.waiting=false; }
      else calc.now = (calc.now==="0") ? k : calc.now+k;
    }else if(k==="."){
      if(calc.waiting){ calc.now="0."; calc.waiting=false; }
      else if(calc.now.indexOf(".")===-1) calc.now+=".";
    }else if(k==="+"||k==="-"||k==="*"||k==="/"){
      var cur=parseFloat(calc.now);
      if(calc.op!==null && !calc.waiting){ calc.acc=calcApply(calc.acc, calc.op, cur); calc.now=calcFmt(calc.acc); }
      else calc.acc=cur;
      calc.op=k; calc.waiting=true;
      calc.expr=calcFmt(calc.acc)+" "+calcSym(k);
    }else if(k==="="){
      if(calc.op===null) return;
      var c2=parseFloat(calc.now);
      calc.expr=calcFmt(calc.acc)+" "+calcSym(calc.op)+" "+calcFmt(c2)+" =";
      calc.acc=calcApply(calc.acc, calc.op, c2); calc.now=calcFmt(calc.acc);
      calc.op=null; calc.waiting=true;
    }else if(k==="C"){
      calc.now="0"; calc.acc=null; calc.op=null; calc.waiting=false; calc.expr="";
    }else if(k==="back"){
      if(!calc.waiting){ calc.now = calc.now.length>1 ? calc.now.slice(0,-1) : "0"; if(calc.now==="-"||calc.now==="") calc.now="0"; }
    }else if(k==="%"){
      var p=parseFloat(calc.now);
      calc.now = (calc.op!==null && calc.acc!=null) ? calcFmt(calc.acc*p/100) : calcFmt(p/100);
    }else if(k==="copy"){
      var cb=document.querySelector(".calc-key.copy");
      copyText(calc.now, cb);
      return;
    }
    calcRender();
  }
  var calcScale = 13;
  function applyCalcScale(){ var p=$("calcPanel"); if(p) p.style.fontSize=calcScale+"px"; }
  function calcZoom(dir){
    calcScale = Math.max(10, Math.min(24, calcScale + (dir==="in"?2:-2)));
    applyCalcScale();
    try{ localStorage.setItem("calcScale", String(calcScale)); }catch(e){}
  }
  function openCalc(){
    var p=$("calcPanel");
    p.classList.remove("hidden");
    calcRender();
  }
  function closeCalc(){ $("calcPanel").classList.add("hidden"); }

  /* ---------- 計算機進階：貼上 / 加總 / 存主題 ---------- */
  var tally = [];
  var noteOn = true;
  function applyNoteVis(){
    var row=$("calcNoteRow"), show=$("calcNoteShow");
    if(!row||!show) return;
    if(noteOn){ row.classList.remove("hidden"); show.classList.add("hidden"); }
    else { row.classList.add("hidden"); show.classList.remove("hidden"); var n=$("calcNote"); if(n) n.value=""; }
  }
  function setNoteOn(v){ noteOn=v; try{ localStorage.setItem("calcNoteOn", v?"1":"0"); }catch(e){} applyNoteVis(); }
  function loadTally(){
    try{
      var a=JSON.parse(localStorage.getItem("calcTally")||"[]");
      if(Array.isArray(a)) tally=a.map(function(x){
        return (x && typeof x==="object") ? {v:+x.v||0, note:String(x.note||"")} : {v:+x||0, note:""};
      });
    }catch(e){}
  }
  function saveTally(){ try{ localStorage.setItem("calcTally", JSON.stringify(tally)); }catch(e){} }
  function tallySum(){ var s=tally.reduce(function(a,b){return a+(+b.v||0);},0); return Math.round((s+Number.EPSILON)*1e10)/1e10; }
  function toast(msg){
    var el=document.createElement("div"); el.className="mini-toast"; el.textContent=msg;
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("show"); });
    setTimeout(function(){ el.classList.remove("show"); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, 1400);
  }
  function renderTape(){
    var box=$("calcTape"); if(!box) return;
    if(!tally.length){ box.classList.add("hidden"); box.innerHTML=""; return; }
    box.classList.remove("hidden");
    var h='<div class="calc-tape-head"><span class="ttl">明細 '+tally.length+' 筆</span>'
        + '<button class="calc-mini" data-t="copyall">複製清單</button>'
        + '<button class="calc-mini" data-t="clear">清空</button></div>';
    h+='<div class="calc-tape-list">';
    tally.forEach(function(e,i){
      h+='<div class="tape-row"><span class="tnote">'+esc(e.note||"")+'</span>'
       + '<span class="tv">'+esc(String(e.v))+'</span>'
       + '<button class="tape-x" data-i="'+i+'" title="刪除">✕</button></div>';
    });
    h+='</div>';
    h+='<div class="tape-total"><span class="lbl">合計</span><span class="tt">'+esc(String(tallySum()))+'</span>'
     + '<button class="calc-mini" data-t="copytotal" title="複製合計">📋</button></div>';
    box.innerHTML=h;
  }
  function tallyAdd(){
    var v=parseFloat(calc.now);
    if(!isFinite(v)) return;
    var ne=$("calcNote"), note=(noteOn && ne)?ne.value.trim():"";
    tally.push({ v:Math.round((v+Number.EPSILON)*1e10)/1e10, note:note });
    if(ne) ne.value="";
    saveTally(); renderTape(); calc.waiting=true;
    toast("已記一筆，合計 "+tallySum());
  }
  function setCalcNum(s){
    var num=parseFloat(String(s).replace(/[^0-9.\-]/g,""));
    if(isFinite(num)){ calc.now=String(num); calc.waiting=false; calcRender(); return true; }
    return false;
  }
  function calcPaste(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(s){
        if(!setCalcNum(s)) toast("剪貼簿沒有可用的數字");
      }, function(){ toast("讀不到剪貼簿，請改用 Ctrl+V 貼上"); });
    }else toast("請改用 Ctrl+V 貼上");
  }
  function calcToItem(){
    if(!curTopic){ toast("先點一個主題"); return; }
    var t=topicById(curTopic);
    t.items.push({ id:uid(), type:"text", title:calc.now, note:"", done:false });
    save(); renderHome();
    toast("已存入「"+t.name+"」");
  }
  function initCalcUI(){
    try{ var s=parseInt(localStorage.getItem("calcScale"),10); if(s) calcScale=s; }catch(e){}
    applyCalcScale();
    // 還原上次位置
    try{
      var pos=JSON.parse(localStorage.getItem("calcPos")||"null");
      if(pos && typeof pos.left==="number"){
        var p=$("calcPanel"); p.style.left=pos.left+"px"; p.style.top=pos.top+"px"; p.style.right="auto";
      }
    }catch(e){}
    // 拖移
    var panel=$("calcPanel"), bar=$("calcBar"), dragging=false, dx=0, dy=0;
    bar.addEventListener("pointerdown", function(e){
      if(e.target.closest(".calc-mini")) return;
      dragging=true;
      var r=panel.getBoundingClientRect();
      dx=e.clientX-r.left; dy=e.clientY-r.top;
      panel.style.right="auto"; panel.style.left=r.left+"px"; panel.style.top=r.top+"px";
      try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    });
    bar.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var x=e.clientX-dx, y=e.clientY-dy;
      var maxX=window.innerWidth-panel.offsetWidth-4, maxY=window.innerHeight-panel.offsetHeight-4;
      x=Math.max(4,Math.min(x,maxX)); y=Math.max(4,Math.min(y,maxY));
      panel.style.left=x+"px"; panel.style.top=y+"px";
    });
    function endDrag(){
      if(!dragging) return; dragging=false;
      try{ localStorage.setItem("calcPos", JSON.stringify({left:parseInt(panel.style.left,10), top:parseInt(panel.style.top,10)})); }catch(e){}
    }
    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
  }

  /* ---------- 密碼鎖 ---------- */
  function unlockGate(){ var g=$("gateOverlay"); if(g) g.style.display="none"; }
  function initGate(){
    var g=$("gateOverlay");
    if(!g) return;
    if(!GATE_PASSWORD || sessionStorage.getItem("gateOk")==="1"){ unlockGate(); return; }
    function tryEnter(){
      var v=$("gateInput").value;
      if(v===GATE_PASSWORD){
        try{ sessionStorage.setItem("gateOk","1"); }catch(e){}
        unlockGate();
      }else{
        var err=$("gateErr"); err.textContent="密碼不對，再試一次";
        var card=g.querySelector(".gate-card");
        card.classList.remove("gate-shake"); void card.offsetWidth; card.classList.add("gate-shake");
        $("gateInput").value=""; $("gateInput").focus();
      }
    }
    $("gateBtn").addEventListener("click", tryEnter);
    $("gateInput").addEventListener("keydown", function(e){ if(e.key==="Enter") tryEnter(); });
    setTimeout(function(){ try{ $("gateInput").focus(); }catch(e){} }, 100);
  }
  initGate();

  /* 主題色（粉珊瑚/薄荷/奶茶/天藍）循環切換 */
  (function(){
    var THEMES=["","theme-mint","theme-milktea","theme-sky"];
    var NAMES=["粉珊瑚","薄荷綠","奶茶","天藍"];
    var i=0; try{ var s=localStorage.getItem("shixiang_theme"); var k=THEMES.indexOf(s||""); if(k>-1) i=k; }catch(e){}
    function apply(){
      THEMES.forEach(function(c){ if(c) document.body.classList.remove(c); });
      if(THEMES[i]) document.body.classList.add(THEMES[i]);
      try{ localStorage.setItem("shixiang_theme", THEMES[i]); }catch(e){}
    }
    apply();
    var btn=$("themeBtn");
    if(btn) btn.addEventListener("click", function(){
      i=(i+1)%THEMES.length; apply();
      if(typeof toast==="function") toast("主題：" + NAMES[i]);
    });
  })();

  /* 便條紙「今日头条」 */
  (function(){
    var MEMO_KEY="shixiang_memo", MEMO_HIDE="shixiang_memo_hide", MEMO_COLOR="shixiang_memo_color";
    var note=$("memoNote"), body=$("memoBody"), show=$("memoShow"), hideBtn=$("memoHide"), dateEl=$("memoDate");
    if(!note||!body) return;
    // 日期
    var d=new Date(), wk=["週日","週一","週二","週三","週四","週五","週六"][d.getDay()];
    if(dateEl) dateEl.textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 "+wk;
    // 內容
    try{ body.value=localStorage.getItem(MEMO_KEY)||""; }catch(e){}
    // 顏色
    var COLORS=["yellow","pink","blue","green"], color="yellow";
    try{ var sc=localStorage.getItem(MEMO_COLOR); if(COLORS.indexOf(sc)>-1) color=sc; }catch(e){}
    function applyColor(){
      COLORS.forEach(function(c){ note.classList.remove("c-"+c); });
      note.classList.add("c-"+color);
      var dots=note.querySelectorAll(".mc-dot");
      for(var i=0;i<dots.length;i++) dots[i].classList.toggle("sel", dots[i].getAttribute("data-c")===color);
    }
    applyColor();
    note.querySelectorAll(".mc-dot").forEach(function(dot){
      dot.addEventListener("click", function(){
        color=dot.getAttribute("data-c");
        try{ localStorage.setItem(MEMO_COLOR,color); }catch(e){}
        applyColor();
      });
    });
    var POS_KEY="shixiang_memo_pos";
    var savedPos=null; try{ var pp=JSON.parse(localStorage.getItem(POS_KEY)||"null"); if(pp&&typeof pp.left==="number") savedPos=pp; }catch(e){}
    var hidden=false; try{ hidden=localStorage.getItem(MEMO_HIDE)==="1"; }catch(e){}
    function curEl(){ return hidden ? show : note; }
    function applyPos(){
      var el=curEl();
      el.style.position="fixed"; el.style.margin="0"; el.style.zIndex="150";
      var w=el.offsetWidth||130, hgt=el.offsetHeight||40;
      if(savedPos){   // 自己拖過位置→展開/收合都待在那
        var L=Math.max(8, Math.min(savedPos.left, window.innerWidth-w-8));
        var T=Math.max(6, Math.min(savedPos.top, window.innerHeight-hgt-8));
        el.style.left=L+"px"; el.style.top=T+"px"; return;
      }
      var cb=$("calcBtn");
      if(el===show){   // 收合膠囊：放在按鈕列「下方」靠右，不擋按鈕
        var top = cb ? cb.getBoundingClientRect().bottom+10 : 84;
        el.style.top=top+"px";
        el.style.left=Math.max(8, window.innerWidth - w - 16)+"px";
        return;
      }
      if(cb){          // 展開便條：錨在計算機左邊同排
        var r=cb.getBoundingClientRect();
        el.style.left=Math.max(8, r.left-12-w)+"px";
        el.style.top=Math.max(6, r.top)+"px";
      }else{
        el.style.top="84px";
        el.style.left=Math.max(8,(window.innerWidth-235)-12-w)+"px";
      }
    }
    function applyVis(){
      if(hidden){ note.classList.add("hidden"); show.classList.remove("hidden"); }
      else{ note.classList.remove("hidden"); show.classList.add("hidden"); }
      applyPos();
    }
    applyVis();
    window.addEventListener("resize", applyPos);
    var saveT=null;
    body.addEventListener("input", function(){
      clearTimeout(saveT);
      saveT=setTimeout(function(){ try{ localStorage.setItem(MEMO_KEY, body.value); }catch(e){} }, 250);
    });
    body.addEventListener("blur", function(){ try{ localStorage.setItem(MEMO_KEY, body.value); }catch(e){} });
    hideBtn.addEventListener("click", function(){ hidden=true; try{ localStorage.setItem(MEMO_HIDE,"1"); }catch(e){} applyVis(); });
    show.addEventListener("click", function(){
      hidden=false; try{ localStorage.setItem(MEMO_HIDE,"0"); }catch(e){}
      applyVis();
      note.style.animation="none"; void note.offsetWidth; note.style.animation="";
    });
    // 清空（兩段確認）
    var clearBtn=$("memoClear");
    if(clearBtn) clearBtn.addEventListener("click", function(){
      if(clearBtn.classList.contains("armed")){
        body.value=""; try{ localStorage.setItem(MEMO_KEY,""); }catch(e){}
        clearBtn.classList.remove("armed"); clearBtn.textContent="清空"; body.focus();
      }else{
        clearBtn.classList.add("armed"); clearBtn.textContent="確定清空?";
        setTimeout(function(){ clearBtn.classList.remove("armed"); clearBtn.textContent="清空"; }, 2200);
      }
    });
    // 拖移便條紙到任意位置
    var head=note.querySelector(".memo-head"), drag=false,dx=0,dy=0;
    head.addEventListener("pointerdown", function(e){
      if(e.target.closest("button,.mc-dot,textarea")) return;
      drag=true;
      var r=note.getBoundingClientRect();
      note.style.position="fixed"; note.style.left=r.left+"px"; note.style.top=r.top+"px"; note.style.margin="0"; note.style.zIndex="150";
      dx=e.clientX-r.left; dy=e.clientY-r.top;
      try{ head.setPointerCapture(e.pointerId); }catch(_){}
    });
    head.addEventListener("pointermove", function(e){
      if(!drag) return;
      var x=e.clientX-dx, y=e.clientY-dy;
      x=Math.max(4,Math.min(x,window.innerWidth-note.offsetWidth-4));
      y=Math.max(4,Math.min(y,window.innerHeight-note.offsetHeight-4));
      note.style.left=x+"px"; note.style.top=y+"px";
    });
    function endDrag(){ if(!drag) return; drag=false;
      savedPos={left:parseInt(note.style.left,10), top:parseInt(note.style.top,10)};
      try{ localStorage.setItem(POS_KEY, JSON.stringify(savedPos)); }catch(e){}
    }
    head.addEventListener("pointerup", endDrag);
    head.addEventListener("pointercancel", endDrag);
    // 雙擊釘子→復位到計算機左邊
    var pin=note.querySelector(".memo-pin");
    if(pin) pin.addEventListener("dblclick", function(){
      savedPos=null; try{ localStorage.removeItem(POS_KEY); }catch(e){}
      applyPos();
      note.style.animation="none"; void note.offsetWidth; note.style.animation="";
    });
  })();

  /* 註解提示小卡片（馬上浮出、支援換行） */
  var annoTip=document.createElement("div");
  annoTip.className="anno-tip"; annoTip.style.display="none";
  document.body.appendChild(annoTip);
  function showAnnoTip(el){
    var r=el.getAttribute("data-r"); if(r===null) return;
    var t=topicById(curTopic); if(!t || !t.anno) return;
    var note=t.anno[r]; if(!note) return;
    annoTip.textContent=note;
    annoTip.style.display="block";
    var rect=el.getBoundingClientRect();
    var tw=annoTip.offsetWidth, th=annoTip.offsetHeight;
    var top=rect.top-th-9, left=rect.left+rect.width/2-tw/2;
    annoTip.classList.toggle("below", top<6);
    if(top<6) top=rect.bottom+9;
    left=Math.max(8, Math.min(left, window.innerWidth-tw-8));
    annoTip.style.top=top+"px"; annoTip.style.left=left+"px";
  }
  function hideAnnoTip(){ annoTip.style.display="none"; }
  document.addEventListener("mouseover", function(e){
    var el=e.target.closest ? e.target.closest(".anno-dot,.anno-btn.has") : null;
    if(el) showAnnoTip(el);
  });
  document.addEventListener("mouseout", function(e){
    var el=e.target.closest ? e.target.closest(".anno-dot,.anno-btn.has") : null;
    if(el) hideAnnoTip();
  });
  window.addEventListener("scroll", hideAnnoTip, true);

  /* ---------- events ---------- */
  $("editTopicBtn").addEventListener("click", function(){ openTopicModal("edit"); });
  $("topicCancel").addEventListener("click", closeTopicModal);
  $("topicSave").addEventListener("click", saveTopic);
  $("delTopicBtn").addEventListener("click", delTopic);
  $("topicInput").addEventListener("keydown", function(e){ if(e.key==="Enter") saveTopic(); });
  $("iconInput").addEventListener("input", function(){
    if($("iconInput").value.trim()){ modalIcon=""; markIcon(); }
  });

  $("addItemBtn").addEventListener("click", addItem);
  $("attachBtn").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){ addFiles(e.target.files); e.target.value=""; });
  $("newItemInput").addEventListener("input", function(){
    $("addItemBtn").disabled = $("newItemInput").value.trim()==="";
  });
  $("newItemInput").addEventListener("keydown", function(e){ if(e.key==="Enter") addItem(); });

  $("itemCancel").addEventListener("click", function(){ $("itemModal").classList.remove("show"); });
  $("itemSave").addEventListener("click", saveItem);

  $("exportBtn").addEventListener("click", doExport);
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(e){ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; });


  // 計算機
  $("calcBtn").addEventListener("click", openCalc);
  $("calcClose").addEventListener("click", closeCalc);
  document.querySelector(".calc-grid").addEventListener("click", function(e){
    var b=e.target.closest ? e.target.closest(".calc-key") : null;
    if(b) calcKey(b.getAttribute("data-k"));
  });
  $("calcBar").addEventListener("click", function(e){
    var z=e.target.closest ? e.target.closest("[data-z]") : null;
    if(z) calcZoom(z.getAttribute("data-z"));
  });
  document.querySelector(".calc-actions").addEventListener("click", function(e){
    var b=e.target.closest ? e.target.closest("[data-a]") : null;
    if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="paste") calcPaste();
    else if(a==="tally") tallyAdd();
    else if(a==="toItem") calcToItem();
  });
  $("calcTape").addEventListener("click", function(e){
    var x=e.target.closest ? e.target.closest(".tape-x") : null;
    if(x){ tally.splice(parseInt(x.getAttribute("data-i"),10),1); saveTally(); renderTape(); return; }
    var t=e.target.closest ? e.target.closest("[data-t]") : null;
    if(!t) return;
    var a=t.getAttribute("data-t");
    if(a==="clear"){ tally=[]; saveTally(); renderTape(); }
    else if(a==="copytotal"){ copyText(String(tallySum()), t); }
    else if(a==="copyall"){ copyText(tally.map(function(e){ return e.note ? (e.note+"\t"+e.v) : String(e.v); }).join("\n"), t); }
  });
  loadTally(); renderTape();
  $("calcNoteHide").addEventListener("click", function(){ setNoteOn(false); });
  $("calcNoteShow").addEventListener("click", function(){ setNoteOn(true); var n=$("calcNote"); if(n) n.focus(); });
  try{ noteOn = localStorage.getItem("calcNoteOn")!=="0"; }catch(e){}
  applyNoteVis();
  // Ctrl+V / 長按貼上：把剪貼簿的數字貼進計算機
  document.addEventListener("paste", function(e){
    if($("calcPanel").classList.contains("hidden")) return;
    if(e.target && e.target.matches && e.target.matches("input,textarea")) return; // 備註欄正常貼上
    var cd=e.clipboardData||window.clipboardData;
    var txt=cd?cd.getData("text"):"";
    if(txt && setCalcNum(txt)){ e.preventDefault(); toast("已貼上 "+calc.now); }
  });
  initCalcUI();
  document.addEventListener("keydown", function(e){
    if($("calcPanel").classList.contains("hidden")) return;
    if(e.target && e.target.matches && e.target.matches("input,textarea")) return; // 打字時不攔截
    var k=e.key;
    if(e.ctrlKey || e.metaKey){            // Ctrl/⌘ 組合
      if(k==="c"||k==="C"){ e.preventDefault(); copyText(calc.now, document.querySelector(".calc-key.copy")); toast("已複製 "+calc.now); }
      return;                              // Ctrl+V 等交給瀏覽器/paste 事件
    }
    if(/^[0-9]$/.test(k)) calcKey(k);
    else if(k===".") calcKey(".");
    else if(k==="+"||k==="-"||k==="*"||k==="/") calcKey(k);
    else if(k==="Enter"||k==="="){ calcKey("="); }
    else if(k==="Backspace"){ calcKey("back"); }
    else if(k==="Escape"){ closeCalc(); }
    else if(k==="c"||k==="C"){ calcKey("C"); }
    else return;
    e.preventDefault();
  });

  // tap backdrop to close
  [$("topicModal"),$("itemModal")].forEach(function(ov){
    ov.addEventListener("click", function(e){ if(e.target===ov) ov.classList.remove("show"); });
  });

  updateAuthBtn();
  if(PINNED_FIRST_SHEET && state.topics[0]) save();   // 固定第一個主題的連動網址
  // 還原上次打開的主題，重開停在原處
  try{ var _last=localStorage.getItem(LASTKEY); if(_last && topicById(_last)) curTopic=_last; }catch(e){}
  renderHome();
  if(curTopic){ maybeSync(curTopic); setupAutoRefresh(curTopic); }

  // 切回此分頁時，順手刷新目前連動主題
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && curTopic){
      var t=topicById(curTopic);
      if(t && t.sheetUrl) syncSheet(curTopic);
    }
  });

})();
</script>
